<!DOCTYPE html>
<html>
    <head>
        <title>EDU SPARK</title>
        <link rel="stylesheet" href="style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
            form {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;  
                gap: 10px;  
            }
            
            input[type="submit"] {
                align-self: center;
            }
            textarea{
                order: -1;
                width: 100%;
                min-height: 100px;
            }
        </style>
    </head>
    <body>
        <header>
            <img src="/assets/logo.svg" height="180" width="180">
            <h1><span class="label">"EDU SPARK"</span> - Children's Learning Portal</h1>
        </header>
        <main>
            <h2>Feedback form</h2>
            <form>
                <fieldset>
                    <legend>Personal information</legend>
                <label>Parent`s surname and name</label>
                <input>
                <br>
                <label>E-mail</label>
                <input type="email">
                <br>
                <label>Child`s age</label>
                <input type="number" min="6" max="15">
                <br>
                <label>Child`s gender</label>
                <select>
                    <option>Boy</option>
                    <option>Girl</option>
                </select>
                </fieldset>
                <label>Purpose</label>
                <select>
                    <option>Cooperation</option>
                    <option>Poor-quality content,</option>
                    <option>Suggestion</option>
                    <option>Error</option>
                </select>
                <label>Details</label>
                <textarea cols="20" rows="2" maxlength="500"></textarea>
                <label>Consent to information processing</label>
                <input type="checkbox" required>
                <label>Submit</label>
                <input type="submit">
            </form>
        </main>
        <footer id="contacts">
            <p>EDU SPARK</p>
            <a href="https://mon.gov.ua" target="_blank">Міністерство освіти і науки України</a>
            <a href="https://nus.org.ua" target="_blank">Нова українська школа</a>
            <p>Address: Kyiv, Ukraine</p>
            <p>Phone: +380 97 829 19 98</p>
        </footer>
    </body>
</html>
